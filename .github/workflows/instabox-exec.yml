name: Instabox Exec Bridge

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Command to run on Instabox debin VM'
        required: false
        default: 'uptime && whoami && pwd'

permissions:
  contents: write

jobs:
  exec:
    runs-on: ubuntu-latest
    steps:
      - name: Execute command on Instabox debin VM
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          MACHINE_ID: "m_agraap7g6udlm4mesrp6f2nbgi"
          CMD: ${{ inputs.cmd }}
        run: |
          set -u
          BODY=$(jq -n --arg cmd "$CMD" '{cmd: $cmd, timeoutSeconds: 120}')
          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST "https://api.instabox.sh/v1/machines/$MACHINE_ID/exec" -H "X-API-Key: $INSTABOX_API_KEY" -H "Content-Type: application/json" -d "$BODY" || true)
          echo "HTTP_CODE=$HTTP_CODE" >> "$GITHUB_ENV"

          # Decode a field: plain text passes through; a single base64 blob (no spaces) is decoded.
          decode_field() {
            local v
            v=$(jq -r "$1" response.json 2>/dev/null || echo '')
            if [ -n "$v" ] && ! printf '%s' "$v" | grep -q ' ' && printf '%s' "$v" | tr -d '\n' | grep -Eq '^[A-Za-z0-9+/=]{16,}$'; then
              printf '%s' "$v" | tr -d '\n' | base64 -d 2>/dev/null || printf '%s' "$v"
            else
              printf '%s' "$v"
            fi
          }

          STDOUT_TXT=$(decode_field '.stdout // ""')
          STDERR_TXT=$(decode_field '.stderr // ""')
          EXIT_CODE=$(jq -r '.exitCode // "n/a"' response.json 2>/dev/null || echo 'n/a')

          {
            echo "time: $(date -u +%FT%TZ)"
            echo "command: $CMD"
            echo "HTTP_STATUS: $HTTP_CODE"
            echo "exitCode: $EXIT_CODE"
            echo "----- STDOUT -----"
            printf '%s\n' "$STDOUT_TXT"
            echo "----- STDERR -----"
            printf '%s\n' "$STDERR_TXT"
            echo "----- END -----"
          } > output.txt

          cat output.txt
          cat output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Publish output to instabox-output branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out
          if [ -f output.txt ]; then cp output.txt /tmp/out/last-output.txt; else echo 'no output' > /tmp/out/last-output.txt; fi
          cd /tmp/out && git init -q && git checkout -q -b instabox-output
          git add last-output.txt
          git -c user.name="instabox-bridge" -c user.email="adrimg3196@gmail.com" commit -qm "instabox output $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/instabox-output

      - name: Fail on non-200
        if: always()
        run: |
          if [ "${HTTP_CODE:-000}" != "200" ]; then echo "Instabox request failed with HTTP ${HTTP_CODE:-000}"; exit 1; fi
